name: ASMlab Dynamic Workspace Gate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-nasm:
    name: v0.4.0 Gate / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install NASM and development tools
        run: sudo apt-get update && sudo apt-get install -y nasm gcc make binutils python3
      - name: Clean native, reference and foundation build; full gate
        shell: bash
        run: |
          set -o pipefail
          make clean
          make -j2 test 2>&1 | tee release-gate.log
      - name: Empty filesystem without libraries (drop execution UID)
        run: sudo python3 tests/l3_core.py --require-empty-root --report build/empty-root.json
      - name: Dynamic workspace without user libraries
        run: sudo python3 tests/dynamic_workspace.py --report build/dynamic-empty-root.json
      - name: Check all fail-closed guards
        shell: bash
        run: |
          set -o pipefail
          make test-guards 2>&1 | tee gate-guards.log
      - name: Upload artifacts and evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asmlab-v040-gate-${{ matrix.os }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            release-gate.log
            gate-guards.log
            build/evidence/
            build/*gate-guards.json
            build/empty-root.json
            build/dynamic-empty-root.json
            build/debug/*.o
            build/debug/*.map
            build/release/*.o
            build/release/*.map
            build/reference/*.o
            build/reference/*.map
            build/runtime/*.o
            build/runtime/*.map
            bin/
