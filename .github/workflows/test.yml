name: NASM Native Gate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-nasm:
    name: Native Gate / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install NASM and development tools
        run: sudo apt-get update && sudo apt-get install -y nasm gcc make binutils python3
      - name: Clean native build and full gate
        shell: bash
        run: |
          set -o pipefail
          make clean
          make -j2 test 2>&1 | tee native-gate.log
      - name: Check fail-closed gate guards
        run: python3 tests/gate_guards.py --report build/gate-guards.json
      - name: Upload evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-gate-${{ matrix.os }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            native-gate.log
            build/evidence/
            build/gate-guards.json
            build/debug/asmlab.map
            build/release/asmlab.map
            bin/asmlab
            bin/asmlab-debug
            bin/*.build.json
            bin/BUILD_ORIGIN.txt
