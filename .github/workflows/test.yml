name: NASM native build and verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-nasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM and build tools
        run: sudo apt-get update && sudo apt-get install -y nasm build-essential binutils python3
      - name: Build NASM sources and run tests
        run: make clean && make test
